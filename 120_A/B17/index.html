<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        body {
            background-color: rgba(244, 244, 244);
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px
        }

        .wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 20px 0;
        }

        h1 {
            text-align: center
        }

        #drop {
            background-color: #fff;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin: 10px 0
        }

        #drop.over {
            background: #e8f4ff;
        }

        .item {
            background-color: #fff;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 6px 0;
            cursor: grab;
            background: #fff
        }

        .item.dragging {
            opacity: .4;
            border: 2px dashed #007bff
        }
    </style>
    <div class="wrap">
        <h1>📁 멀티 파일 업로드</h1>
        <input type="file" id="fi" multiple>
    </div>
    <div id="drop">여기로 파일을 드래그하거나 클릭하여 선택하세요</div>
    <div id="list"></div>
    <script src="../lib.js"></script>
    <script>
        let files = [], drag = null, kb = n => (n / 1024).toFixed(1) + ' KB', render = () => {
            list.innerHTML = files.map((f, i) => `<div class="item" draggable="true" data-i="${i}">${f.name} (${kb(f.size)})</div>`).join('');
            $$('#list .item').forEach(el => {
                el.ondragstart = () => { drag = +el.dataset.i; el.classList.add('dragging') };
                el.ondragend = () => el.classList.remove('dragging');
                el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
                el.ondragleave = () => el.classList.remove('over');
                el.ondrop = e => { e.preventDefault(); el.classList.remove('over'); const to = +el.dataset.i; files.splice(to, 0, files.splice(drag, 1)[0]); render() };
            })
        }, add = f => { files.push(...f); render() };
        fi.onchange = () => add(fi.files);
        drop.onclick = () => fi.click();
        drop.ondragover = e => { e.preventDefault(); drop.classList.add('over') };
        drop.ondragleave = () => drop.classList.remove('over');
        drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files) };
    </script>
</body>

</html>
