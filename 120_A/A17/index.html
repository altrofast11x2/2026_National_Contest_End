<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
</head>
<style>
    body {
        display: grid;
        place-content: center;
        min-height: 100vh;
        perspective: 1000px;
        background-color: #233656;
    }

    ul {
        display: flex;
        align-items: center;
        transform-style: preserve-3d;
        width: 230px;
        height: 125px;
        position: relative;
        animation: spin 15s linear infinite;
        user-select: none;
    }

    @keyframes spin {
        from {
            transform: rotateY(0deg);
        }

        to {
            transform: rotateY(-360deg);
        }
    }

    li {
        position: absolute;
        width: 100%;
        height: 100%;
        outline: 2px solid #fff;
        cursor: pointer;
    }

    img {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .label {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        text-align: center;
        line-height: 125px;
        background-color: #00000090;
        color: #fff;
        font-weight: bold;
        opacity: 0;
        transition: .3s;
    }

    li:hover .label {
        opacity: 1;
    }

    li:nth-child(1) {
        transform: rotateY(0deg) translateZ(500px);
    }

    li:nth-child(2) {
        transform: rotateY(30deg) translateZ(500px);
    }

    li:nth-child(3) {
        transform: rotateY(60deg) translateZ(500px);
    }

    li:nth-child(4) {
        transform: rotateY(90deg) translateZ(500px);
    }

    li:nth-child(5) {
        transform: rotateY(120deg) translateZ(500px);
    }

    li:nth-child(6) {
        transform: rotateY(150deg) translateZ(500px);
    }

    li:nth-child(7) {
        transform: rotateY(180deg) translateZ(500px);
    }

    li:nth-child(8) {
        transform: rotateY(210deg) translateZ(500px);
    }

    li:nth-child(9) {
        transform: rotateY(240deg) translateZ(500px);
    }

    li:nth-child(10) {
        transform: rotateY(270deg) translateZ(500px);
    }

    li:nth-child(11) {
        transform: rotateY(300deg) translateZ(500px);
    }

    li:nth-child(12) {
        transform: rotateY(330deg) translateZ(500px);
    }
</style>

<body>
    <ul>
        <li><img src="./images/image1.jpg" alt="image1"><span class="label">Image1</span></li>
        <li><img src="./images/image2.jpg" alt="image2"><span class="label">Image2</span></li>
        <li><img src="./images/image3.jpg" alt="image3"><span class="label">Image3</span></li>
        <li><img src="./images/image4.jpg" alt="image4"><span class="label">Image4</span></li>
        <li><img src="./images/image5.jpg" alt="image5"><span class="label">Image5</span></li>
        <li><img src="./images/image6.jpg" alt="image6"><span class="label">Image6</span></li>
        <li><img src="./images/image7.jpg" alt="image7"><span class="label">Image7</span></li>
        <li><img src="./images/image8.jpg" alt="image8"><span class="label">Image8</span></li>
        <li><img src="./images/image9.jpg" alt="image9"><span class="label">Image9</span></li>
        <li><img src="./images/image10.jpg" alt="image10"><span class="label">Image10</span></li>
        <li><img src="./images/image11.jpg" alt="image11"><span class="label">Image11</span></li>
        <li><img src="./images/image12.jpg" alt="image12"><span class="label">Image12</span></li>
    </ul>
</body>

</html>
